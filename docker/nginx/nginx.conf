# nginx main configuration for the DEV container (docker on the mac).
# Bare-metal production keeps Alpine's stock /etc/nginx/nginx.conf (with `user www-data;`,
# logs under /var/log/nginx) — every site setting lives in http.d/ryogasp.com.conf.
user www-data;
worker_processes auto;
pcre_jit on;
pid /run/nginx.pid;
error_log /dev/stderr warn;

include /etc/nginx/modules/*.conf;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	server_tokens off;

	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;

	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
	                '$status $body_bytes_sent "$http_referer" '
	                '"$http_user_agent" "$http_x_forwarded_for"';
	access_log /dev/stdout main;

	include /etc/nginx/http.d/*.conf;
}
