# This is a nginx translation of the Apache rules that used to run the site:
#   * src/ryogasp.htaccess (SPIP 4.2.4 htaccess + ryogasp custom rules, see git history)
#   * SPIP 4.4 htaccess.txt (hidden files, composer.*, IMG sandbox, .api)
#   * IMG/.htaccess (hash_documents plugin), config|tmp|vendor/.htaccess (deny all)
# Rule order follows the .htaccess so behaviour can be compared line by line.
#
# This file is used by the dev container and adapted for production TLS.
# nginx terminates connections directly, so PHP receives its native
# $scheme, $https and $server_port values (no $_SERVER['HTTPS'] workaround).

# Apache: RewriteRule ^[^\.]+(\.html)?$ spip.php [QSA,E=url_propre:$0,L]
# Only paths without a dot (or ending in .html) are SPIP "URLs propres"; $0 has no leading slash.
map $uri $spip_url_propre {
	default                       "";
	"~^/(?<path>[^.]+(\.html)?)$" $path;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name ryogasp.com localhost _;

	# spip core lies here and custom files are symlinked
	root  /var/www/html;
	index index.php;

	# in dev nginx listens on 80 but is reached through localhost:9000:
	# emit relative Location headers (e.g. the trailing-slash redirect on directories)
	absolute_redirect off;

	# site tuning lives here (server level) so bare-metal keeps the stock nginx.conf
	client_max_body_size 64m;    # >= PHP post_max_size (40M)
	fastcgi_read_timeout 300s;   # SPIP pages can be slow to (re)compute
	fastcgi_buffer_size 32k;
	fastcgi_buffers 16 32k;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
	           application/xml application/rss+xml application/atom+xml image/svg+xml;

	# real client IP from the host proxy (proxy_set_header X-Real-IP $remote_addr)
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header   X-Real-IP;

	# ErrorDocument 404 /spip.php?page=404 ; ErrorDocument 403 /spip.php?page=403
	error_page 404 /spip.php?page=404;
	error_page 403 /spip.php?page=403;

	# nginx-generated 5xx (php-fpm unreachable): static teapot page from the squelettes
	error_page 500 502 503 504 /502.html;
	location = /502.html {
		internal;
		root /var/www/html/squelettes;
	}

	################ REGLAGES PERSONNALISES ######################

	# pages speciales
	rewrite ^/plan$     /spip.php?page=plan     last;
	rewrite ^/rss$      /spip.php?page=backend  last;
	rewrite ^/activite$ /spip.php?page=activite last;
	rewrite ^/miniblog$ /spip.php?page=miniblog last;

	# anciens sites (a RewriteRule to an absolute URL is a 302 unless R=301 is given)
	rewrite ^/babel$            http://babel.ryogasp.com redirect;
	rewrite ^/ryoga/ryoga\.htm$ http://richardcornu.com  redirect;
	rewrite ^/ryoga(.*)$        http://archives.ryogasp.com/ryoga/$1        permanent;
	rewrite ^/bikoko(.*)$       http://archives.ryogasp.com/bikoko/$1       permanent;
	rewrite ^/onedayonearth(.*)$ http://archives.ryogasp.com/onedayonearth/$1 permanent;

	## blogs : correspondance RSS + pages d'archives jolies
	rewrite ^/blog/rss(\.php)?$ /spip.php?page=backend&id_rubrique=1 last;
	rewrite "^/blog/archives/([0-9-]{4})-([0-9]{2})$"           /spip.php?page=archives&id_rubrique=1&date=$1-$2        last;
	rewrite "^/blog/archives/([0-9-]{4})-([0-9]{2})-([0-9]{2})$" /spip.php?page=archivesjour&id_rubrique=1&date=$1-$2-$3 last;

	rewrite ^/gameover/rss(\.php)?$ /spip.php?page=backend&id_rubrique=21 last;
	rewrite "^/gameover/archives/([0-9-]{4})-([0-9]{2})$"           /spip.php?page=archives&id_rubrique=21&date=$1-$2        last;
	rewrite "^/gameover/archives/([0-9-]{4})-([0-9]{2})-([0-9]{2})$" /spip.php?page=archivesjour&id_rubrique=21&date=$1-$2-$3 last;

	################ GESTIONS DES URLS SPIP #######################

	# Compatibilite avec les URLS "html" (Apache applied these only when no such file exists; none does)
	rewrite "^/rubrique([0-9]+)(\.html)?$" /spip.php?page=rubrique&id_rubrique=$1 last;
	rewrite "^/article([0-9]+)(\.html)?$"  /spip.php?page=article&id_article=$1   last;
	rewrite "^/breve([0-9]+)(\.html)?$"    /spip.php?page=breve&id_breve=$1       last;
	rewrite "^/mot([0-9]+)(\.html)?$"      /spip.php?page=mot&id_mot=$1           last;
	rewrite "^/auteur([0-9]+)(\.html)?$"   /spip.php?page=auteur&id_auteur=$1     last;
	rewrite "^/site([0-9]+)(\.html)?$"     /spip.php?page=site&id_syndic=$1       last;

	# ping http://site/1234 => article1234
	rewrite "^/([1-9][0-9]*)$" /spip.php?action=redirect&type=article&status=301&id=$1 last;

	# SPIP 4.4 htaccess.txt: *.api endpoints
	rewrite "^/(ecrire/)?([\w]+)\.api([/.](.*))?$" /spip.php?action=api_$2&arg=$4 last;

	# Fichiers "standards" (si absents de la racine)
	location = /robots.txt  { try_files $uri /spip.php?page=robots.txt; }
	location = /humans.txt  { try_files $uri /spip.php?page=humans.txt; }
	location = /favicon.ico { try_files $uri /spip.php?page=favicon.ico; }
	location = /sitemap.xml { try_files $uri /spip.php?page=sitemap.xml; }

	################ GESTIONS DES ACCES FICHIERS #####################

	# bloquer les acces aux fichiers caches (.git, .svn, .htaccess...) sauf .well-known (letsencrypt)
	location ~ /\.(?!well-known/) {
		return 403;
	}

	# SPIP 4.4 htaccess.txt: RedirectMatch 404 ^/composer\.(json|lock|phar)$
	location ~ ^/composer\.(json|lock|phar)$ {
		return 404;
	}

	# config/.htaccess, tmp/.htaccess, vendor/.htaccess: Require all denied
	location ~ ^/(config|tmp|vendor)/ {
		deny all;
	}

	# IMG/ : uploaded documents, served as static files only (never PHP).
	#   IMG/.htaccess (hash_documents plugin): RewriteCond %{REQUEST_FILENAME} !-f
	#                                          RewriteRule .* ../index.php?action=hash_404 [L]
	#   SPIP 4.4 htaccess.txt: Content-Security-Policy "sandbox" on files served from IMG/, except PDFs
	location ^~ /IMG/ {
		add_header Content-Security-Policy "sandbox";
		try_files $uri /index.php?action=hash_404;

		# SPIP 4.4 htaccess.txt: bloquer les fichiers php dans IMG & local
		location ~ \.ph(p[0-9]?|tml)$ {
			return 403;
		}

		location ~ \.pdf$ {
			# any add_header here stops the parent's sandbox header from being inherited
			add_header X-Content-Type-Options nosniff;
			try_files $uri /index.php?action=hash_404;
		}
	}

	# local/ : SPIP public cache (thumbnails, compiled css/js), static only
	# ($uri/ so that a directory gives 403 like Apache did, not 404)
	location ^~ /local/ {
		try_files $uri $uri/ =404;

		# SPIP 4.4 htaccess.txt: bloquer les fichiers php dans IMG & local
		location ~ \.ph(p[0-9]?|tml)$ {
			return 403;
		}
	}

	# php-fpm ping for the container HEALTHCHECK
	location = /fpm-ping {
		access_log off;
		allow 127.0.0.1;
		allow ::1;
		deny all;
		include /etc/nginx/fastcgi-spip.conf;
		fastcgi_param SCRIPT_NAME     /ping;
		fastcgi_param SCRIPT_FILENAME /ping;
	}

	# PHP scripts (spip.php, index.php, ecrire/, plugins...) — Apache executed .php anywhere outside the denied dirs
	location ~ \.php$ {
		try_files $uri =404;
		include /etc/nginx/fastcgi-spip.conf;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
	}

	# Si le fichier ou repertoire demande existe, le servir ; sinon URLs "propres" / "arbo" -> SPIP
	location / {
		try_files $uri $uri/ @spip;
	}

	location @spip {
		# not a clean URL (has a dot, not .html): Apache fell through to ErrorDocument 404
		if ($spip_url_propre = "") {
			return 404;
		}
		include /etc/nginx/fastcgi-spip.conf;
		fastcgi_param SCRIPT_FILENAME    $document_root/spip.php;
		fastcgi_param SCRIPT_NAME        /spip.php;
		# Apache's E=url_propre:$0 reaches PHP as $_SERVER['REDIRECT_url_propre']
		fastcgi_param REDIRECT_url_propre $spip_url_propre;
	}
}
