; php-fpm pool for SPIP — unix socket shared with the nginx workers (same user)
[www]
user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; used by the container HEALTHCHECK through nginx (/fpm-ping)
ping.path = /ping
ping.response = pong

; PHP errors end up in the container log
catch_workers_output = yes
decorate_workers_output = no
