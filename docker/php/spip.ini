; PHP defaults for SPIP. Sizes, timeouts and timezone come from the environment
; (99-env.ini, written by docker-entrypoint.sh from the PHP_* variables).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
ignore_repeated_errors = On
error_reporting = E_ERROR | E_WARNING | E_PARSE | E_CORE_ERROR | E_CORE_WARNING | E_COMPILE_ERROR | E_COMPILE_WARNING | E_RECOVERABLE_ERROR

realpath_cache_size = 4096k
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1

apc.enable_cli = 0
